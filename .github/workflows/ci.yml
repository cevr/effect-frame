name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt

      - name: Test
        run: bun run test

      # The deploy build prerenders, which reads content; the gate and
      # `bun run test` never run it (#23 §2.1).
      - name: Deploy build
        run: bun run test:deploy
