name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Full suite 5 times
        run: |
          set +e
          fails=0
          for i in 1 2 3 4 5; do bun run test --force > full-$i.log 2>&1; code=$?; echo "run $i exit $code"; [ $code -ne 0 ] && fails=$((fails+1)); grep -E -B40 "\(fail\)" full-$i.log | grep -v "(pass)" | head -120; done
          echo "failed runs: $fails"
          exit $fails
