name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # The same gate lefthook runs before a commit: typecheck, lint,
      # format check, build, boundary, declarations, then the tests.
      - name: Gate
        run: bun run gate

      # The deploy build prerenders, which reads content; the gate and
      # `bun run test` never run it (#23 §2.1).
      - name: Deploy build
        run: bun run test:deploy
