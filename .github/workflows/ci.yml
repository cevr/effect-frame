name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so `changeset status` can diff against main.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # A pull request that changes the published package's src or manifest
      # carries a changeset (.changeset/config.json `changedFilePatterns`;
      # private packages are not versioned). The Version PR is exempt: it
      # consumes the changesets.
      - name: Changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: bunx changeset status --since=origin/main

      # The same gate lefthook runs before a commit: typecheck, lint,
      # format check, build, boundary, declarations, then the tests.
      - name: Gate
        run: bun run gate

      # The deploy build prerenders, which reads content; the gate and
      # `bun run test` never run it (#23 §2.1).
      - name: Deploy build
        run: bun run test:deploy
