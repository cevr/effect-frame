name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Expiry debug (full suite)
        run: |
          set +e
          for i in 1 2 3 4 5; do bun run test > full-$i.log 2>&1; echo "run $i exit $?"; grep -E -B60 "\(fail\)" full-$i.log | grep -v "(pass)" | head -150; done
